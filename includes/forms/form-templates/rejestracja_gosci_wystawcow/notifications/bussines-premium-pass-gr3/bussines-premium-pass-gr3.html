<!doctype html>
<html lang="{{lang}}">
    <head>
        <meta charset="UTF-8" />
        <title>{{notification_title}}</title>
    </head>

    <body style="text-align: justify; max-width: 600px; margin: 0 auto; font-family: &quot;Open Sans&quot;, &quot;Montserrat&quot;, sans-serif">
        <div>
            <img style="width: 100%" src="https://[trade_fair_domainadress]/doc/vip.jpg" alt="[trade_fair_name]" />
        </div>
        <div style="padding: 0 5px">
            <h3 style="font-size: 18px; margin: 20px 0 10px; text-align: left">{{greeting}}</h3>
            <p style="font-size: 14px; margin: 25px 0 25px; text-align: center">{{invitation_text}}</p>

            <table cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                    <td align="center">
                        <table border="0" cellspacing="0" cellpadding="0">
                            <tr>
                                <td style="background-color: [trade_fair_accent]; border-radius: 16px">
                                    <a href="https://pwe.ticketpoland.pl/aktywuj/260113/{entry_id}_24697" target="_blank" style="display: block; min-width: 300px; padding: 12px 24px; font-weight: 600; text-align: center; text-decoration: none; color: white; border-radius: 16px"> {{activate_button}} </a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>

            <p style="font-size: 14px; margin: 35px 0 25px; text-align: center">
                <b>{{entitles_heading}}</b>
            </p>
            <table cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr align="center">
                    <td align="center">
                        <img src="{{entitles_image_url}}" />
                    </td>
                </tr>
            </table>

            <table cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr align="center">
                    <td class="no-mobile-width" valign="center" align="center" style="display: inline-block; width: 100%; max-width: 275px; padding-top: 15px">
                        <a href="{{calendar_url}}" target="_blank" style="display: inline-block; padding: 9px 20px 7px; text-decoration: none; color: white; background-color: #d6b685; border-radius: 16px; font-weight: 600; font-size: 15px; line-height: 25px"> {{calendar_button}} </a>
                        <img src="https://[trade_fair_domainadress]/wp-content/plugins/pwe-media/media/ticket/kalendarz.png" alt="Kalendarz" style="display: block; max-width: 100%; height: auto; padding-top: 10px" />
                    </td>
                    <td align="center" valign="top" style="display: inline-block; width: 100%; max-width: 275px; padding-top: 15px">
                        <a href="{{more_url}}" target="_blank" style="display: inline-block; padding: 9px 20px 7px; text-decoration: none; color: white; background-color: #d6b685; border-radius: 16px; font-weight: 600; font-size: 15px; line-height: 25px"> {{more_button}} </a>
                    </td>
                </tr>
            </table>

            <div style="width: 95%; border-bottom: 1px solid rgba(188, 188, 188, 0.4); margin: 15px auto"></div>

            <table cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr align="center">
                    <td align="center" style="display: inline-block; width: 100%; max-width: 275px; font-size: 15px; margin-left: 15px; margin-bottom: 25px; line-height: 25px">
                        <p><strong>{{qr_text}}</strong></p>
                    </td>
                    <td class="no-mobile-width" valign="center" align="center" style="display: inline-block; width: 100%; max-width: 275px">
                        <div style="border: 3px solid #d6b685; width: 80%; margin: 12px auto; padding: 10px 3px 10px 3px; border-radius: 20px">{{qr_img}}</div>
                        <p style="font-size: 11px; line-height: 18px">{{qr_blocking_text}}</p>
                    </td>
                </tr>
            </table>
            <table cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr align="center">
                    <td valign="center" align="center" style="display: inline-block; width: 100%; padding: 5px 0">
                        <div align="center" style="margin: 0px 0" class="socials">
                            <a target="_blank" style="display: inline-block; width: 50px; padding-right: 20px" href="[trade_fair_linkedin]" class="btn__fb">
                                <img style="width: 50px; height: 50px" src="https://[trade_fair_domainadress]/wp-content/plugins/pwe-media/media/ticket/media_Business_linkedin.png" alt="linked__icon" />
                            </a>
                            <a target="_blank" style="display: inline-block; width: 50px; padding-right: 20px" href="[trade_fair_facebook]" class="btn__fb">
                                <img style="width: 50px; height: 50px" src="https://[trade_fair_domainadress]/wp-content/plugins/pwe-media/media/ticket/media_Business_fb.png" alt="fb__icon" />
                            </a>
                            <a target="_blank" style="display: inline-block; width: 50px; padding-right: 20px" href="[trade_fair_youtube]" class="btn__fb">
                                <img style="width: 50px; height: 50px" src="https://[trade_fair_domainadress]/wp-content/plugins/pwe-media/media/ticket/media_Business_yt.png" alt="yt__icon" />
                            </a>
                            <a target="_blank" style="display: inline-block; width: 50px; padding-right: 20px" href="[trade_fair_instagram]" class="btn__fb">
                                <img style="width: 50px; height: 50px" src="https://[trade_fair_domainadress]/wp-content/plugins/pwe-media/media/ticket/media_Business_instagram.png" alt="insta__icon" />
                            </a>
                        </div>
                    </td>
                </tr>
            </table>

            <div style="width: 95%; border-bottom: 1px solid rgba(188, 188, 188, 0.4); margin: 15px auto"></div>
            <p style="padding: 0 5px">{{regards}}</p>
            <p style="padding: 0 5px; font-size: 12px">{{auto_message}}</p>
            <div style="width: 95%; border-bottom: 1px solid rgba(188, 188, 188, 0.4); margin: 15px auto"></div>

            <table cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr align="center">
                    <td valign="center" align="center" style="display: inline-block; width: 100%; padding: 5px 0">
                        <img style="max-width: 590px" src="https://warsawexpo.eu/assets/mail/footer.jpg" />
                    </td>
                </tr>
            </table>

            <table cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr align="center">
                    <td valign="center" style="padding: 16px; background-color: #000; color: #fff" align="center">{{copyright}}</td>
                </tr>
            </table>

            <p style="margin-top: 10px; padding: 0 5px; font-size: 12px" class="footer__rodo">{{privacy_notice}}</p>
        </div>
    </body>
</html>
