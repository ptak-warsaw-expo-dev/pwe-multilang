<!doctype html>
<html lang="{{lang}}">
    <head>
        <style>
            @media (max-width: 600px) {
                table {
                    width: 100% !important;
                }

                td {
                    display: block;
                    width: 100% !important;
                    text-align: center;
                }

                img {
                    max-width: 100% !important;
                    height: auto !important;
                }

                .btn {
                    display: block !important;
                    width: 80% !important;
                    margin: 10px auto !important;
                }
            }
        </style>
        <title>{{notification_title}}</title>
    </head>

    <body style="text-align: left; max-width: 600px; margin: 0 auto; font-family: sans-serif">
        <table width="100%">
            <tr>
                <td>
                    <img style="width: 100%" src="{{header_image_url}}" alt="[trade_fair_name] Vip" />
                </td>
            </tr>
        </table>
        <table width="100%" cellpadding="10" cellspacing="0" border="0">
            <tr>
                <td style="max-width: 400px">
                    <h5 style="font-size: 16px; margin: 20px 0">{{greeting}}</h5>
                    <p style="font-size: 14px">{{invitation_intro}}</p>
                    <p style="font-size: 14px">{{stand_invitation}}</p>
                </td>
                <td style="max-width: 200px">
                    <img style="max-height: 200px; max-width: 200px" src="{{logo_src}}" alt="{Firma Zapraszająca:5}" />
                </td>
            </tr>
        </table>
        <table width="100%" align="center" cellpadding="10">
            <tr>
                <td align="center" style="padding-top: 0px">
                    <hr style="margin: 0; max-width: 300px; border-width: 0; height: 2px; background: lightgray" />
                </td>
            </tr>
        </table>
        <table width="100%" cellpadding="10" cellspacing="0" border="0">
            <tr>
                <td>
                    <h6 style="font-size: 14px; margin: 20px 0">{{vip_package_title}}</h6>
                    <p style="font-size: 14px">{{vip_package_items}}</p>
                </td>
            </tr>
        </table>
        <table width="100%" align="center" cellpadding="10">
            <tr>
                <td align="center">
                    <img width="90%" src="{{vip_package_image_url}}" alt="Pakiet Vip" />
                </td>
            </tr>
        </table>
        <table width="100%" align="center" cellpadding="10">
            <tr>
                <td align="center" style="padding-top: 0px">
                    <hr style="margin: 0; max-width: 300px; border-width: 0; height: 2px; background: lightgray" />
                </td>
            </tr>
        </table>
        <table width="100%" cellpadding="10" cellspacing="0" border="0">
            <tr>
                <td>
                    <p style="font-size: 14px">{{fair_description}}</p>
                </td>
            </tr>
        </table>
        <table width="100%" cellpadding="10">
            <tr align="center">
                <td valign="center" style="max-width: 350px">
                    <p style="font-size: 14px">{{qr_instruction}}</p>
                </td>
                <td valign="center" style="max-width: 200px">
                    <p style="font-size: 14px; color: lightgray; margin: 2px">{{scan_label}}</p>
                    <img src="{{qr_src}}" style="width: 160px; border: 3px solid lightgray; border-radius: 8px; padding: 6px" />
                </td>
            </tr>
        </table>
        <table width="100%" align="center" cellpadding="10">
            <tr>
                <td align="center" style="padding-top: 0px">
                    <hr style="margin: 0; max-width: 300px; border-width: 0; height: 2px; background: lightgray" />
                </td>
            </tr>
        </table>
        <table width="100%" cellpadding="10">
            <tr>
                <td>
                    <h6 style="font-size: 14px; margin: 20px 0">{{event_details_link}}</h6>
                    <p style="font-size: 14px">{{regards}}</p>
                </td>
            </tr>
        </table>
        <table width="100%" cellpadding="10">
            <tr>
                <td>
                    <img style="display: block; max-width: 100%; height: auto; margin: 0" src="{{footer_image_url}}" alt="email_footer" />
                </td>
            </tr>
        </table>
        <table width="100%" cellpadding="10">
            <tr align="center">
                <td>
                    <a href="[trade_fair_facebook]" style="margin-right: 20px; text-decoration: none">
                        <img src="https://[trade_fair_domainadress]/wp-content/plugins/pwe-media/media/generator-gosci-wystawcow/facebook-icon.png" alt="Facebook Link" style="width: 40px" />
                    </a>
                    <a href="[trade_fair_instagram]" style="margin-right: 20px; text-decoration: none">
                        <img src="https://[trade_fair_domainadress]/wp-content/plugins/pwe-media/media/generator-gosci-wystawcow/instagram-icon.png" alt="Instagram Link" style="width: 40px" />
                    </a>
                    <a href="[trade_fair_linkedin]" style="margin-right: 20px; text-decoration: none">
                        <img src="https://[trade_fair_domainadress]/wp-content/plugins/pwe-media/media/generator-gosci-wystawcow/linkedin-icon.png" alt="Linkedin Link" style="width: 40px" />
                    </a>
                    <a href="[trade_fair_youtube]" style="text-decoration: none">
                        <img src="https://[trade_fair_domainadress]/wp-content/plugins/pwe-media/media/generator-gosci-wystawcow/youtube-icon.png" alt="Youtube Link" style="width: 40px" />
                    </a>
                </td>
            </tr>
        </table>
        <table width="100%" cellpadding="10">
            <tr>
                <td>
                    <p style="font-size: 12px">{{privacy_notice}}</p>
                </td>
            </tr>
        </table>
    </body>
</html>
