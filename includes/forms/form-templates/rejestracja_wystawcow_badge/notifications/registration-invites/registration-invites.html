<!doctype html>
<html lang="{{lang}}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="Content-Type" content="text/html charset=UTF-8" />
        <title>{{notification_title}}</title>
    </head>

    <body style="text-align: justify; max-width: 600px; margin: 0 auto; font-family: &quot;Open Sans&quot;, &quot;Montserrat&quot;, sans-serif">
        <div>
            <img style="width: 100%" src="[pwe_mailing_header_url]" alt="[trade_fair_name]" />
        </div>
        <div style="padding: 0 5px">
            <h3 style="font-size: 20px; margin: 20px 0 10px">{{greeting}}</h3>
            <p style="font-size: 14px; margin: 0 0 10px">{{confirmation_text}}</p>
            <div align="center" style="margin: 20px 0" class="socials">
                <a target="_blank" style="display: inline-block; width: 50px; margin: 0 15px; padding: 5px" href="[trade_fair_facebook]" class="btn__fb">
                    <img style="width: 100%; height: auto" src="https://warsawexpo.eu/docs/facebookIcon.png" alt="fb__icon" />
                </a>
                <a target="_blank" style="display: inline-block; width: 50px; margin: 0 15px; padding: 5px" href="[trade_fair_instagram]" class="btn__fb">
                    <img style="width: 100%; height: auto" src="https://warsawexpo.eu/docs/instagramicon.png" alt="insta__icon" />
                </a>
            </div>
            <p style="font-size: 14px; margin: 30px 0 0" class="greeting">{{regards}}</p>
            <sub style="font-size: 12px; margin: 0">{{auto_message}}</sub>
        </div>
        <div style="margin: 20px 0 10px">
            <img style="display: block; max-width: 100%; height: auto; margin: 0" src="https://warsawexpo.eu/assets/mail/footer.jpg" alt="email_footer" />
            <p align="center" style="padding: 16px; background-color: #000; color: #fff; margin: 0; line-height: 1">
                © [trade_fair_actualyear] Ptak Warsaw Expo
                <span style="display: block; margin-top: 4px">{{copyright_text}}</span>
            </p>
        </div>
        <p style="margin-top: 10px; padding: 0 5px; font-size: 12px" class="footer__rodo">{{privacy_notice}}</p>
    </body>
</html>
